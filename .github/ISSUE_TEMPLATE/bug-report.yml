name: Bug report / Ошибка
description: Runtime, Trajectory, Termux, skills, tools или интерфейс приложения.
title: 'bug: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: Русский и English welcome. Укажите проверяемые шаги и коммит сборки. Перед отправкой удалите ключи, токены и приватные данные из логов и Trajectory.
- type: dropdown
  id: area
  attributes:
    label: Область / Area
    options:
    - Agent runtime / compaction
    - Trajectory / full trace export
    - Termux jobs / skill sync
    - Skill workspace / agent editing tools
    - ReBro preset
    - Tool access / TTS / Whisper
    - Providers / chat
    - Browser / workflows / Telegram
    - Files / media / other
  validations:
    required: true
- type: input
  id: build
  attributes:
    label: Версия и коммит / Version and commit
    description: COMMIT.txt из APK-архива; app version в настройках.
  validations:
    required: true
- type: input
  id: device
  attributes:
    label: Устройство и Android / Device and Android
    description: 'Укажите также: физический телефон или эмулятор.'
  validations:
    required: true
- type: input
  id: model
  attributes:
    label: Модель и провайдер / Model and provider
    description: Если относится к проблеме; без API-ключей.
  validations:
    required: false
- type: textarea
  id: steps
  attributes:
    label: Как воспроизвести / Steps to reproduce
    placeholder: '1. Открыть…

      2. Включить…

      3. Выполнить…'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Ожидание и результат / Expected and actual behavior
  validations:
    required: true
- type: textarea
  id: settings
  attributes:
    label: Релевантные настройки / Relevant settings
    description: Включённые tools/skills, RUN_COMMAND, sync, таймауты — если относятся к ошибке.
  validations:
    required: false
- type: textarea
  id: evidence
  attributes:
    label: Логи и снимки / Logs and screenshots
    description: Приложите релевантный фрагмент. Полный экспорт трассы может содержать приватные данные.
  validations:
    required: false
