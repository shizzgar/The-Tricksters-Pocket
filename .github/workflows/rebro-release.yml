name: ReBro release APK

on:
  workflow_dispatch:
  push:
    branches: [feat/termux-workspaces-release]
    tags: ['v*-rebro.*']
    paths-ignore: ['README*.md', 'CHANGELOG.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: rebro-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/compaction-debug.yml
  build_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.22.1'
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Build optimized release APKs
        run: bash ./gradlew --no-daemon --build-cache --max-workers=2 :app:assembleRelease
      - name: Record release provenance and signing tools
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*arm64-v8a*.apk)
          test "${#apks[@]}" -eq 1
          mkdir -p build/rebro-release
          cp "${apks[0]}" build/rebro-release/rebro-2.5.1-rebro.4-arm64-unsigned.apk
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" build/rebro-release/
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "${apks[0]}" > build/rebro-release/APK-BADGING.txt
          if grep -q 'application-debuggable' build/rebro-release/APK-BADGING.txt; then exit 1; fi
          grep -q "name='excp.rikkahub.rebro'" build/rebro-release/APK-BADGING.txt
          git rev-parse HEAD > build/rebro-release/COMMIT.txt
          cd build/rebro-release
          sha256sum *.apk apksigner.jar > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: rebro-arm64-release-candidate
          path: build/rebro-release/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rebro-release-build-reports
          path: |
            app/build/outputs/mapping/
            app/build/reports/
            app/schemas/
          if-no-files-found: warn
          retention-days: 30
  release:
    needs: [verify, build_release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rebro-arm64-release-candidate
          path: build/rebro-release/
      - uses: actions/upload-artifact@v7
        with:
          name: rebro-arm64-release-unsigned
          path: build/rebro-release/
          if-no-files-found: error
          retention-days: 30
